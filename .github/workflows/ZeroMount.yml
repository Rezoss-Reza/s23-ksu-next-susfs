name: Build kernel (ZeroMount KSU-Next)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential git curl \
            libelf-dev libssl-dev liblz4-tool lz4 \
            pahole dwarves cpio python3 python-is-python3 \
            tar perl zip zlib1g-dev

      - name: Prepare Samsung kernel source
        shell: bash
        run: |
          set -euo pipefail

          git clone -b android13-5.15 \
            https://github.com/samsung-sm8550/kernel_samsung_sm8550-common.git kernel
          cd kernel

          COMMON_REMOTE="https://android.googlesource.com/kernel/common"
          COMMON_BRANCH="android13-5.15-lts"

          get_make_var() {
            awk -v key="$1" '$1 == key && $2 == "=" { print $3; exit }' "$2"
          }

          LOCAL_VERSION="$(get_make_var VERSION Makefile)"
          LOCAL_PATCHLEVEL="$(get_make_var PATCHLEVEL Makefile)"
          LOCAL_SUBLEVEL="$(get_make_var SUBLEVEL Makefile)"

          UPSTREAM_MAKEFILE="$(mktemp)"
          trap 'rm -f "$UPSTREAM_MAKEFILE"' EXIT
          curl -fsSL "${COMMON_REMOTE}/+/refs/heads/${COMMON_BRANCH}/Makefile?format=TEXT" \
            | base64 -d > "$UPSTREAM_MAKEFILE"

          UPSTREAM_VERSION="$(get_make_var VERSION "$UPSTREAM_MAKEFILE")"
          UPSTREAM_PATCHLEVEL="$(get_make_var PATCHLEVEL "$UPSTREAM_MAKEFILE")"
          UPSTREAM_SUBLEVEL="$(get_make_var SUBLEVEL "$UPSTREAM_MAKEFILE")"

          echo "Samsung kernel: ${LOCAL_VERSION}.${LOCAL_PATCHLEVEL}.${LOCAL_SUBLEVEL}"
          echo "Android common: ${UPSTREAM_VERSION}.${UPSTREAM_PATCHLEVEL}.${UPSTREAM_SUBLEVEL}"

          if [[ "$LOCAL_VERSION.$LOCAL_PATCHLEVEL" != "$UPSTREAM_VERSION.$UPSTREAM_PATCHLEVEL" ]]; then
            echo "::error::Kernel base mismatch; refusing automatic LTS merge."
            exit 1
          fi

          if (( LOCAL_SUBLEVEL < UPSTREAM_SUBLEVEL )); then
            echo "Merging ${COMMON_BRANCH}..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote add android-common "$COMMON_REMOTE"
            git fetch --depth=100 --no-tags android-common "$COMMON_BRANCH"
            git merge -X ours --no-edit --no-ff FETCH_HEAD

            echo "Applying Samsung LTS compile fixes..."
            patch --batch --forward -p1 --fuzz=3 \
              < "$GITHUB_WORKSPACE/samsung_lts_compile_fix.patch"
          else
            echo "Samsung source is already at the same or newer LTS sublevel."
          fi

          echo "KERNEL_VERSION=$(get_make_var SUBLEVEL Makefile)" >> "$GITHUB_ENV"

      - name: Integrate KernelSU-Next, SUSFS and ZeroMount
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          PATCH_DIR="$GITHUB_WORKSPACE/patches/zeromount"

          echo "Integrating KernelSU-Next dev..."
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s dev

          echo "Applying Samsung-adapted local patches..."
          for PATCH_NAME in \
            50_add_susfs_in_gki-android13-5.15.patch \
            51_enhanced_susfs-android13-5.15.patch \
            60_zeromount-android13-5.15.patch
          do
            echo "  -> $PATCH_NAME"
            patch --batch --forward -p1 --fuzz=3 < "$PATCH_DIR/$PATCH_NAME"
          done

          echo "  -> 70_ksu_safety-kernelsu-next-5.15.patch"
          patch --batch --forward -d KernelSU-Next -p1 --fuzz=3 \
            < "$PATCH_DIR/70_ksu_safety-kernelsu-next-5.15.patch"

          echo "  -> 72_ksu_sucompat-current-dev-fix.patch"
          patch --batch --forward -d KernelSU-Next -p1 --fuzz=3 \
            < "$PATCH_DIR/72_ksu_sucompat-current-dev-fix.patch"

          echo "  -> 73_ksu_execveat-symbol-collision-fix.patch"
          patch --batch --forward -d KernelSU-Next -p1 --fuzz=3 \
            < "$PATCH_DIR/73_ksu_execveat-symbol-collision-fix.patch"

          if find . -type f -name '*.rej' -print -quit | grep -q .; then
            echo "::error::Patch reject files remain:"
            find . -type f -name '*.rej' -print
            exit 1
          fi

          SUCOMPAT="KernelSU-Next/kernel/feature/sucompat.c"
          SH_COUNT="$(grep -c 'static char __user \*sh_user_path' "$SUCOMPAT")"
          KSUD_EXISTS_COUNT="$(grep -c '^static bool is_ksud_exists' "$SUCOMPAT")"
          FACCESSAT_COUNT="$(grep -c '^long ksu_handle_faccessat_sucompat' "$SUCOMPAT")"
          STAT_COUNT="$(grep -c '^long ksu_handle_stat_sucompat' "$SUCOMPAT")"

          echo "sucompat source counts: sh_user_path=$SH_COUNT is_ksud_exists=$KSUD_EXISTS_COUNT faccessat=$FACCESSAT_COUNT stat=$STAT_COUNT"

          # Patch 70 leaves the current upstream is_ksud_exists/faccessat text in
          # the CONFIG_KSU_SUSFS-disabled branch, while patch 72 restores one
          # active copy in the SUSFS branch. Therefore two textual definitions
          # are expected for those two symbols, but only one is compiled.
          [[ "$SH_COUNT" -eq 1 ]]
          [[ "$KSUD_EXISTS_COUNT" -eq 2 ]]
          [[ "$FACCESSAT_COUNT" -eq 2 ]]
          [[ "$STAT_COUNT" -eq 1 ]]
          echo "Local patch set applied cleanly; sucompat source layout matches the expected SUSFS branches."

      - name: Set up swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          chmod +x scripts/build.sh
          ./scripts/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          echo "=== Checking final ZeroMount configuration ==="
          grep 'CONFIG_ZEROMOUNT' out/.config || true
          if ! grep -qx 'CONFIG_ZEROMOUNT=y' out/.config; then
            echo "::error::CONFIG_ZEROMOUNT=y is missing from final out/.config"
            exit 1
          fi
          echo "CONFIG_ZEROMOUNT=y confirmed."

      - name: Package AnyKernel3
        id: package
        shell: bash
        run: |
          set -euo pipefail
          unzip "$GITHUB_WORKSPACE/anykernel.zip" -d anykernel/
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/

          ZIP_NAME="common-5.15.${KERNEL_VERSION}-3d64R-ZeroMount-$(date +%d%m%y-%H%M%S)"
          (
            cd anykernel
            zip -r0 "$GITHUB_WORKSPACE/${ZIP_NAME}.zip" ./*
          )

          echo "zip_path=$GITHUB_WORKSPACE/${ZIP_NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: experimental_build-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: Kernel Build by ${{ github.repository }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}